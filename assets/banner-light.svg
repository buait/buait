<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">buait — Build agents. Break agents. Then secure them.</title>
  <desc id="desc">Light profile banner: a shield and terminal mark, the wordmark buait, the tagline Build agents. Break agents. Then secure them., and the Chinese subtitle 构建 Agent · 攻破 Agent · 加固 Agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="102" y1="106" x2="186" y2="221" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="102" y1="106" x2="186" y2="221" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="rule" x1="96" y1="272" x2="1184" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#94a3b8" stop-opacity="0.55"/>
      <stop offset="0.9" stop-color="#94a3b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowTeal">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSky">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#0f172a" stroke-opacity="0.05" stroke-width="1" fill="none"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="gridMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#gridFade)"/>
    </mask>
    <clipPath id="frame">
      <rect width="1280" height="320"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
    <ellipse cx="150" cy="330" rx="450" ry="300" fill="url(#glowTeal)"/>
    <ellipse cx="1150" cy="10" rx="470" ry="320" fill="url(#glowSky)"/>
    <path d="M0 1H1280" stroke="#0d9488" stroke-opacity="0.2" stroke-width="1"/>

    <g>
      <circle cx="1148" cy="150" r="56" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="1148" cy="150" r="104" stroke="#0284c7" stroke-opacity="0.17" stroke-width="1" stroke-dasharray="2 9"/>
      <circle cx="1148" cy="150" r="152" stroke="#0284c7" stroke-opacity="0.11" stroke-width="1" stroke-dasharray="1 11"/>
      <circle cx="1148" cy="150" r="200" stroke="#0284c7" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="1148" cy="150" r="248" stroke="#0284c7" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M1140 150h16M1148 142v16" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="1148" cy="46" r="3" fill="#0d9488"/>
      <circle cx="1148" cy="46" r="7" stroke="#0d9488" stroke-opacity="0.3" stroke-width="1"/>
    </g>

    <g transform="translate(96 104)">
      <path d="M48 2 90 18v50c0 26-18 43-42 51C24 111 6 94 6 68V18Z" fill="url(#shieldFill)" stroke="url(#accent)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M48 14 80 28v38c0 20-14 34-32 41-18-7-32-21-32-41V28Z" stroke="#0d9488" stroke-opacity="0.22" stroke-width="1" stroke-linejoin="round"/>
      <text x="48" y="73" text-anchor="middle" fill="#0d9488" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="600" letter-spacing="1">&gt;_</text>
    </g>

    <text x="236" y="176" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="84" font-weight="700" letter-spacing="-2">buait</text>
    <text x="238" y="217" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" letter-spacing="0.2">Build agents. Break agents. Then secure them.</text>
    <text x="238" y="250" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400" letter-spacing="1.4">构建 Agent · 攻破 Agent · 加固 Agent</text>

    <path d="M96 272H1184" stroke="url(#rule)"/>
    <text x="96" y="292" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.4">GITHUB.COM/BUAIT</text>
    <text x="1184" y="292" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.4">SINCE 2024</text>
  </g>
